name: Render and publish report

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing commits the rendered site to the gh-pages branch.
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # No R is installed. The R analysis is executed on the developer's
      # machine and its results are committed under _freeze/, so CI only
      # performs the markdown -> HTML step. This removes the entire class
      # of "install 79 R packages from scratch on a clean runner" failures.
      #
      # Note the directory name: with `freeze: auto`, Quarto WRITES two
      # copies (the hidden .quarto/_freeze/ scratch dir and this visible
      # _freeze/) but only READS the visible project-root _freeze/ when it
      # renders on CI. Committing only .quarto/_freeze/ would leave CI with
      # nothing to thaw from, so the check below deliberately guards _freeze/.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Keep this equal to your local `quarto --version` so the frozen
          # output and the rendering toolchain match.
          version: "1.10.18"

      # Fail with a readable message rather than a cryptic Quarto error if the
      # freeze data was never committed (i.e. `quarto render` was not run
      # locally before pushing).
      - name: Check that frozen computations are present
        run: |
          if [ ! -d "_freeze" ]; then
            echo "::error::_freeze/ is missing. Run 'quarto render' locally and commit _freeze/ before pushing."
            exit 1
          fi
          echo "Freeze data found:"
          find _freeze -type f | head -20

      # `quarto publish gh-pages` cannot create the gh-pages branch itself when
      # it runs headless in CI. Create an empty orphan branch on the remote,
      # once; the push sends a single commit object, so the working tree and
      # the checked-out main branch are untouched. Idempotent.
      - name: Initialise gh-pages branch if missing
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "gh-pages already exists; nothing to do."
          else
            echo "gh-pages not found; creating an empty orphan branch."
            empty_tree=$(git hash-object -t tree /dev/null)
            init_commit=$(git -c user.name="github-actions[bot]" \
                               -c user.email="github-actions[bot]@users.noreply.github.com" \
                               commit-tree "$empty_tree" -m "Initialise gh-pages branch")
            git push origin "${init_commit}:refs/heads/gh-pages"
          fi

      # Renders the project (reusing the frozen computations) and pushes the
      # result to gh-pages.
      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
