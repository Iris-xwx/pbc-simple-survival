name: Render and publish report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: renv        # follow the R version pinned in renv.lock

      # Restores the exact package versions from renv.lock into the system
      # library. Uses renv::restore() rather than pak's dependency solver, so
      # it cannot drift onto packages that no longer exist on CRAN.
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - uses: quarto-dev/quarto-actions/setup@v2

      # publish renders the project first, then pushes _site/ to gh-pages.
      # A separate render step is unnecessary and only risks output mismatch.
      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
