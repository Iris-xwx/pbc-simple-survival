project:
  title: "D-penicillamine in Primary Biliary Cholangitis"
  type: default

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-summary: "Show the code"
    fig-cap-location: bottom
    embed-resources: true

execute:
  echo: true
  warning: false
  message: false
  # Compute locally, render on CI. The R results are frozen under the
  # project-root _freeze/ directory (committed) and reused when the source has
  # not changed, so the GitHub Action never needs R installed. See README
  # "Publishing". Quarto also mirrors them into .quarto/_freeze/, which is
  # local scratch and git-ignored.
  freeze: auto
