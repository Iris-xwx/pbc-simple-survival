name: Render and publish report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Install Linux binaries from Posit Package Manager instead of compiling
      # from source. V8 ships a prebuilt jammy binary here, so the build
      # toolchain and libnode-dev are not strictly required.
      RENV_CONFIG_REPOS_OVERRIDE: "https://packagemanager.posit.co/cran/__linux__/jammy/latest"
    steps:
      - uses: actions/checkout@v6

      # System libraries that R packages compile or link against on Linux.
      # libnode-dev provides the V8 headers/libs that gt -> juicyjuice -> V8
      # needs; the V8 package links against the Node-bundled V8 on Ubuntu.
      # libcurl/openssl/xml2/libpng cover curl, openssl, xml2 and ragg/png.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnode-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libpng-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: renv        # follow the R version pinned in renv.lock

      # Restores the exact package versions from renv.lock. Uses renv::restore()
      # rather than pak's dependency solver, so it cannot drift onto packages
      # that no longer exist on CRAN.
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pin the Quarto version so the report is built by the same toolchain
          # on every run instead of silently following the latest release.
          # Check your local version with `quarto --version` and keep it close.
          version: "1.10.18"

      # `quarto publish gh-pages` cannot create the gh-pages branch itself when
      # it runs headless in CI; it fails with
      #   Unable to publish to GitHub Pages (the remote origin does not have a
      #   branch named "gh-pages")
      # Create an empty orphan branch on the remote, once. The push sends a
      # single commit object, so neither the working tree nor the checked-out
      # main branch is touched.
      - name: Initialise gh-pages branch if missing
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "gh-pages already exists; nothing to do."
          else
            echo "gh-pages not found; creating an empty orphan branch."
            empty_tree=$(git hash-object -t tree /dev/null)
            init_commit=$(git -c user.name="github-actions[bot]" \
                               -c user.email="github-actions[bot]@users.noreply.github.com" \
                               commit-tree "$empty_tree" -m "Initialise gh-pages branch")
            git push origin "${init_commit}:refs/heads/gh-pages"
          fi

      # publish renders the project first, then pushes _site/ to gh-pages.
      # A separate render step is unnecessary and only risks output mismatch.
      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
